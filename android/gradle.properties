org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Work around a flaky Kotlin daemon "Storage ... is already registered" crash
# on plugin modules (e.g. shared_preferences_android). Running the compiler
# in-process with incremental compilation off avoids the corrupt daemon cache.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
